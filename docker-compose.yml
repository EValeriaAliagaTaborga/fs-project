services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en .env}
    ports:
      # 5433 en la PC porque el 5432 lo ocupa el PostgreSQL instalado en Windows
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./react-first/backend
    restart: always
    # Igual que --init en docker run: permite que el contenedor se detenga limpio
    init: true
    environment:
      # El host es "postgres" (el nombre del servicio), nunca localhost
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env}
      PORT: 3000
    # Aplica las migraciones pendientes antes de arrancar, así basta con "docker compose up"
    command: sh -c "npx prisma migrate deploy && exec node dist/src/index.js"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./react-first/fs-projectManager
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
