name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  frontend:
    name: Frontend - Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./react-first/fs-projectManager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: react-first/fs-projectManager/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend - Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./react-first/backend
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: react-first/backend/package-lock.json
      - run: npm ci
      - run: npm run build

  pruebas:
    name: Pruebas unitarias y cobertura
    runs-on: ubuntu-latest
    defaults:
      run:
        # El ejemplo de la guía usa ./frontend; en este repo el frontend vive acá
        working-directory: ./react-first/fs-projectManager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22 en vez del 20 del ejemplo, para no tener dos versiones de Node
          # distintas conviviendo en el mismo pipeline
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: react-first/fs-projectManager/package-lock.json
      - run: npm ci
      # Falla si la cobertura no alcanza los thresholds de vitest.config.js.
      # Eso es exactamente lo que convierte la cobertura en parte del quality gate.
      - run: npx vitest run --coverage

  e2e:
    name: Pruebas E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./react-first/fs-projectManager

    # A diferencia del ejemplo de la guía, esta app es fullstack: la prueba E2E inicia
    # sesión de verdad contra el backend Express, que a su vez necesita PostgreSQL.
    # Sin esta base de datos el login falla y la prueba no puede ni empezar.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        # Sin el health check, los pasos podrían arrancar antes de que Postgres
        # acepte conexiones y fallarían de forma intermitente
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Los valores viven cifrados en Settings → Secrets and variables → Actions.
    # Este archivo es público: solo nombra los secretos, nunca contiene su valor.
    # Si alguno llegara a imprimirse en un log, GitHub lo reemplaza por ***.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          # Este job instala las dependencias de los dos proyectos, así que la caché
          # tiene que mirar ambos package-lock.json
          cache-dependency-path: |
            react-first/fs-projectManager/package-lock.json
            react-first/backend/package-lock.json

      - name: Instalar dependencias del frontend
        run: npm ci

      - name: Instalar dependencias del backend
        run: npm ci
        working-directory: ./react-first/backend

      # El cliente de Prisma no está versionado (/src/generated/ está en .gitignore),
      # así que hay que generarlo acá o el backend no arranca
      - name: Generar el cliente de Prisma
        run: npx prisma generate
        working-directory: ./react-first/backend

      # migrate deploy aplica las migraciones existentes sin crear ninguna nueva:
      # es la variante pensada para entornos automatizados, a diferencia de migrate dev
      - name: Crear las tablas en la base de datos
        run: npx prisma migrate deploy
        working-directory: ./react-first/backend

      - name: Instalar el navegador de Playwright
        run: npx playwright install --with-deps chromium

      # playwright.config.ts levanta el backend y el frontend por su cuenta (webServer)
      - name: Correr las pruebas E2E
        run: npx playwright test

      # Guarda el reporte HTML aunque las pruebas fallen: es la evidencia para revisar
      # qué pasó, con capturas y trazas de los pasos que fallaron
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: react-first/fs-projectManager/playwright-report/
          retention-days: 30
  migraciones:
    name: Migraciones y Seeds
    runs-on: ubuntu-latest

    # PostgreSQL desechable: existe solo mientras dura este job, en una máquina
    # aislada de GitHub. Por eso sus credenciales pueden ir en texto plano,
    # a diferencia de las de una base real (ver Lab 1: GitHub Secrets).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        # La guía usa ./backend; en este repo el backend vive acá
        working-directory: ./react-first/backend

    env:
      # Tiene que coincidir con usuario, contraseña y base del servicio de arriba
      DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: react-first/backend/package-lock.json
      - run: npm ci
      # Aplica solo las migraciones pendientes de prisma/migrations; nunca crea nuevas
      - run: npx prisma migrate deploy
      # seed.ts importa el cliente generado, que no está en git (/src/generated/ está en .gitignore)
      - run: npx prisma generate
      # Se corre dos veces a propósito: la segunda demuestra que el seed no duplica datos
      # ni falla por el email único del usuario demo
      - name: Seed (primera corrida)
        run: npx prisma db seed
      - name: Seed (segunda corrida, debe ser idempotente)
        run: npx prisma db seed
  deploy-staging:
    name: Deploy a Staging
    # Si cualquiera de estos jobs falla, este ni se intenta: el quality gate
    # de la Sesión 4 ahora también protege al despliegue.
    needs: [frontend, backend, pruebas, e2e, migraciones]
    # La guía usa 'refs/heads/main'; la rama por defecto de este repo es master.
    # Con 'main' el job aparecería siempre como "skipped" sin dar ningún error.
    # La segunda condición excluye los Pull Requests: solo se despliega lo ya fusionado.
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Railway CLI
        run: npm install -g @railway/cli

      # La guía usa un token de proyecto en RAILWAY_TOKEN. Este proyecto usa un token
      # de cuenta, que la CLI lee de RAILWAY_API_TOKEN y que además exige enlazar el
      # proyecto: el runner es una máquina limpia, sin el enlace que existe en local.
      # El ID del proyecto no es una credencial, por eso puede ir en texto plano.
      - name: Enlazar el proyecto de Railway
        run: railway link --project 34bc2044-302f-442e-90d6-61204778aab1 --environment staging --service fs-project
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      # railway up sube el repo completo como contexto; el servicio en Railway tiene
      # Root Directory = react-first/backend y encuentra ahí su Dockerfile.
      # --ci espera a que el build termine y falla el job si el build falla.
      - name: Desplegar a Railway (staging)
        run: railway up --ci
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
